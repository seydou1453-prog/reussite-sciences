{% extends "base.html" %}{% block title %}Créer un compte{% endblock %}{% block content %}
<h1>Créer un compte</h1><form method="post" class="panel">
<label>E-mail<input type="email" name="email" required autocomplete="email"></label>
<label>Numéro de téléphone<input type="tel" name="phone" required autocomplete="tel"></label>
<label>Mot de passe (8 caractères minimum)<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
<button class="btn">Créer mon compte</button></form><p>Déjà inscrit ? <a href="{{ url_for('login') }}">Se connecter</a></p>
{% endblock %}
