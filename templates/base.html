<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b68">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>{% block title %}Réussite Sciences{% endblock %}</title>
</head>
<body>
<header class="top"><a href="{{ url_for('home') }}" class="brand">🎓 Réussite Sciences</a>
{% if session.get('user_id') %}<a href="{{ url_for('logout') }}">Déconnexion</a>{% endif %}
</header>
<main class="wrap">
  {% with messages = get_flashed_messages() %}{% if messages %}
    {% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}
  {% endif %}{% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Apprendre · Comprendre · S'entraîner · Réussir</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
